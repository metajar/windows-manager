name: Release

# Cut a release by pushing a version tag (v0.0.1 or 0.0.1). Cross-compiles
# binaries on Linux; builds the MSI on Windows (WiX requires Windows APIs).
on:
  push:
    tags:
      - 'v*'       # preferred: v0.0.1, v1.2.3
      - '[0-9]*'   # also accept bare semver tags like 0.0.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set version
        id: v
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test -race ./...

      - name: Build binaries (matrix + checksums)
        run: make release VERSION=${{ steps.v.outputs.version }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dist-binaries
          path: dist/*

  msi:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: dist-binaries
          path: dist

      - name: Build Windows agent MSI
        shell: bash
        run: |
          VERSION=${{ needs.build.outputs.version }} \
          AGENT_EXE="$PWD/dist/rewardd-agent-windows-amd64.exe" \
          OUT="$PWD/dist/rewardd-agent-${VERSION}.msi" \
          bash build/msi/build-msi.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-release
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: [build, msi]
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-release
          path: dist

      - name: Refresh checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
